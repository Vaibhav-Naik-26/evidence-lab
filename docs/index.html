<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How to judge a study</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <h1 id="title"></h1>
    <p id="lede"></p>
    <ul id="stats" class="stats"></ul>
  </header>

  <main>
    <section>
      <h2>The evidence ladder</h2>
      <ol id="ladder" class="ladder"></ol>
    </section>

    <section>
      <h2 id="vc-h"></h2>
      <p id="vc-body"></p>
      <p id="vc-fix" class="fix"></p>
    </section>

    <section id="vote-demo">
      <h2 id="vd-h"></h2>
      <p id="vd-intro"></p>

      <div class="vd-grid">
        <fieldset>
          <legend id="vd-a-l"></legend>
          <label>Studies <input type="number" id="a-n" min="1" max="50"></label>
          <label>People per study <input type="number" id="a-p" min="1" max="100000"></label>
        </fieldset>

        <fieldset>
          <legend id="vd-b-l"></legend>
          <label>Studies <input type="number" id="b-n" min="1" max="50"></label>
          <label>People per study <input type="number" id="b-p" min="1" max="100000"></label>
        </fieldset>
      </div>

      <div aria-hidden="true">
        <div class="bar"><span id="bar-a"></span></div>
        <div class="bar"><span id="bar-b"></span></div>
      </div>

      <p id="vd-count" class="verdict"></p>
      <p id="vd-weigh" class="verdict" aria-live="polite"></p>
    </section>

    <section>
      <h2>When advice was reversed</h2>
      <ol id="timeline" class="timeline"></ol>
    </section>

    <section>
      <h2>What reviews have settled</h2>
      <div id="cases"></div>
    </section>

    <section>
      <h2>Why weak claims go viral</h2>
      <p id="viral"></p>
    </section>

    <section>
      <h2 id="pol-h"></h2>
      <p id="pol-intro"></p>
      <div id="pol-list" class="cards"></div>
    </section>

    <section id="widget">
      <h2 id="w-h"></h2>
      <label>Type of evidence <select id="w-type"></select></label>
      <label>Sample size <select id="w-size"></select></label>
      <p id="w-out" class="verdict" aria-live="polite"></p>
    </section>
  </main>

  <footer id="sources"></footer>
  <script src="app.js"></script>
</body>

</html>
